# JUW Marketplace Netlify Configuration
# Single-domain full-stack deployment for Vite frontend + Serverless Node.js backend

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]

# 1. API Route Rewrites (MUST take precedence over SPA fallback)
# Routes all frontend /api/* calls directly to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 2. React Router SPA Fallback (/admin, /seller, /product/:id, /orders, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
